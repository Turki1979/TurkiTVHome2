name: Build TurkiTVHome v2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: unzip -o TurkiTVHome-v2.zip -d tvhome-v2

      - name: Build APK
        working-directory: tvhome-v2
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TurkiTVHome-v2-apk
          path: tvhome-v2/app/build/outputs/apk/debug/*.apk
